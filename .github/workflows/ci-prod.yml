name: CI — Prod

on:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend — Build, Test & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore backend/CodeSheriff.slnx

      - name: Build
        run: dotnet build backend/CodeSheriff.slnx --no-restore -c Release

      - name: Test
        run: dotnet test backend/CodeSheriff.slnx --no-build -c Release --logger "console;verbosity=normal"

      - name: Deploy to Railway
        uses: railwayapp/railway-action@v2
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: backend

  frontend:
    name: Frontend — Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: cd frontend && npm ci

      - name: Build
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      # Vercel deployment is handled automatically via the Vercel GitHub integration.
      # Add VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID secrets if you prefer CLI deployment.
