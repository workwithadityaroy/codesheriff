name: CI/CD — Production

# ================================================
# Runs on PR to main (validate) + merge to main (deploy)
# Validates: build, lint, test
# Deploys: frontend to Vercel, backend to Railway
# ================================================

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:

  # ── Frontend Validate ─────────────────────────
  frontend-validate:
    name: 🖥️ Frontend — Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 TypeScript check
        run: npm run type-check

      - name: 🧹 Lint
        run: npm run lint

      - name: 🏗️ Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

  # ── Backend Validate ──────────────────────────
  backend-validate:
    name: ⚙️ Backend — Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 📦 Restore NuGet packages
        run: dotnet restore

      - name: 🏗️ Build solution
        run: dotnet build --no-restore --configuration Release

      - name: 🧪 Run all tests
        run: dotnet test CodeSheriff.Tests/CodeSheriff.Tests.csproj --no-build --configuration Release --verbosity normal

  # ── Deploy Frontend → Vercel ──────────────────
  deploy-frontend:
    name: 🚀 Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    needs: [frontend-validate, backend-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'

  # ── Deploy Backend → Railway ──────────────────
  deploy-backend:
    name: 🚀 Deploy Backend → Railway
    runs-on: ubuntu-latest
    needs: [frontend-validate, backend-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Railway
        uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: 'codesheriff-api'
