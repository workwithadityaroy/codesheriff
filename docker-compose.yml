version: '3.9'

# ================================================
# CodeSheriff — Local Development Infrastructure
# ================================================
# Run: docker-compose up -d
# Stop: docker-compose down
# Reset: docker-compose down -v

services:

  # ── PostgreSQL (mirrors Supabase locally) ──────
  postgres:
    image: postgres:15-alpine
    container_name: codesheriff_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codesheriff
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (mirrors Upstash locally) ───────────
  redis:
    image: redis:7-alpine
    container_name: codesheriff_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Commander UI (optional, for debugging) ──
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: codesheriff_redis_ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

  # ── pgAdmin UI (optional, for debugging) ──────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: codesheriff_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@codesheriff.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: codesheriff_network
